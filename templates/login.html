{% extends "base.html" %}

{% block title %}Login | Nexora{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">NEXORA</div>

        <h1>Welcome back</h1>

        <p class="auth-subtitle">
            Sign in to access your personalized recommendations.
        </p>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="auth-button">
                Sign In
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

    </div>

</section>

{% endblock %}
